[package]
name = "sd-virtual-deck"
version = "1.0.0"
edition = "2021"
description = "Virtual Stream Deck via Linux uhid — bridges to mobile app via WebSocket"

[[bin]]
name = "sd-virtual-deck"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
url = "2"
libc = "0.2"
base64 = "0.22"
