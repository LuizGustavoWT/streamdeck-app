<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Button Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
      font-size: 13px;
    }
    .field { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #a0a0b0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 6px 8px; background: #16213e; border: 1px solid #0f3460; border-radius: 4px; color: #e0e0e0; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #533483; }
    input[type="color"] { height: 32px; padding: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="field">
    <label>Button Label</label>
    <input type="text" id="label" placeholder="My Button" value="">
  </div>
  <div class="field">
    <label>Text Color</label>
    <input type="color" id="color" value="#FFFFFF">
  </div>
  <script>
    // OpenAction Property Inspector registration
    function connectOpenActionSocket(port, propertyInspectorUUID, registerEvent, info) {
      const ws = new WebSocket('ws://localhost:' + port);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          event: registerEvent,
          uuid: propertyInspectorUUID,
        }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.event === 'didReceiveSettings') {
          const settings = msg.payload?.settings || {};
          document.getElementById('label').value = settings.label || '';
          document.getElementById('color').value = settings.color || '#FFFFFF';
        }
      };

      // Save settings on change
      function saveSettings() {
        ws.send(JSON.stringify({
          event: 'setSettings',
          context: propertyInspectorUUID,
          payload: {
            label: document.getElementById('label').value,
            color: document.getElementById('color').value,
          },
        }));
      }

      document.getElementById('label').addEventListener('input', saveSettings);
      document.getElementById('color').addEventListener('input', saveSettings);
    }

    // Stream Deck SDK compatibility
    const connectElgatoStreamDeckSocket = connectOpenActionSocket;
  </script>
</body>
</html>
