<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotkey Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 12px;
      font-size: 13px;
    }
    .field { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; color: #a0a0b0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 6px 8px; background: #16213e; border: 1px solid #0f3460; border-radius: 4px; color: #e0e0e0; font-size: 13px; }
    input:focus { outline: none; border-color: #533483; }
  </style>
</head>
<body>
  <div class="field">
    <label>Modifiers (comma-separated: Ctrl,Alt,Shift,Win)</label>
    <input type="text" id="modifiers" placeholder="Ctrl,Shift" value="">
  </div>
  <div class="field">
    <label>Key</label>
    <input type="text" id="key" placeholder="A" value="">
  </div>
  <script>
    function connectOpenActionSocket(port, propertyInspectorUUID, registerEvent, info) {
      const ws = new WebSocket('ws://localhost:' + port);

      ws.onopen = () => {
        ws.send(JSON.stringify({ event: registerEvent, uuid: propertyInspectorUUID }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.event === 'didReceiveSettings') {
          const s = msg.payload?.settings || {};
          document.getElementById('modifiers').value = s.modifiers || '';
          document.getElementById('key').value = s.key || '';
        }
      };

      function saveSettings() {
        ws.send(JSON.stringify({
          event: 'setSettings',
          context: propertyInspectorUUID,
          payload: {
            modifiers: document.getElementById('modifiers').value,
            key: document.getElementById('key').value,
          },
        }));
      }

      document.getElementById('modifiers').addEventListener('input', saveSettings);
      document.getElementById('key').addEventListener('input', saveSettings);
    }

    const connectElgatoStreamDeckSocket = connectOpenActionSocket;
  </script>
</body>
</html>
