version: 2
updates:
  # Mobile app (Expo / React Native)
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "mobile"
    open-pull-requests-limit: 5
    versioning-strategy: auto

  # Plugin
  - package-ecosystem: "npm"
    directory: "/plugin/com.streamdeckapp.mobile.sdPlugin"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "plugin"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
